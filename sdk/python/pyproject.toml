[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ifora-sdk"
version = "0.1.0"
description = "Python SDK for the IFora identity platform API (generated from its OpenAPI document)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["ifora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
