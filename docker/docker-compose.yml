services:
  postgres:
    image: postgres:16-alpine
    container_name: identityforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: identityforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: identityforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identityforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: identityforge-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: identityforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://identityforge:${POSTGRES_PASSWORD}@postgres:5432/identityforge
      - DATABASE_URL_ASYNC=postgresql+asyncpg://identityforge:${POSTGRES_PASSWORD}@postgres:5432/identityforge
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in docker/.env}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in docker/.env}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: identityforge-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: