# Project name "ifora" (dev/prod). The demo override sets "ifora-demo".
name: ifora

services:
  postgres:
    image: postgres:16-alpine@sha256:1fb72075a1de85a1d39de23c2da81baef1b71bf5c0b61a14cbbfdb072a6246d9
    container_name: ifora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ifora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ifora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: ifora-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: ifora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://ifora:${POSTGRES_PASSWORD}@postgres:5432/ifora
      - DATABASE_URL_ASYNC=postgresql+asyncpg://ifora:${POSTGRES_PASSWORD}@postgres:5432/ifora
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in docker/.env}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in docker/.env}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in docker/.env}
      - ADMIN_MFA_REQUIRED=${ADMIN_MFA_REQUIRED:-true}
      - OIDC_KEY_ENCRYPTION_KEY=${OIDC_KEY_ENCRYPTION_KEY:-}
      - SWA_ENCRYPTION_KEY=${SWA_ENCRYPTION_KEY:-}
      - SWA_ENCRYPTION_KEY_PREVIOUS=${SWA_ENCRYPTION_KEY_PREVIOUS:-}
      - RECIPE_ENCRYPTION_KEY=${RECIPE_ENCRYPTION_KEY:-}
      - RECIPE_ENCRYPTION_KEY_PREVIOUS=${RECIPE_ENCRYPTION_KEY_PREVIOUS:-}
      - RECIPE_SECRET_PROVIDER=${RECIPE_SECRET_PROVIDER:-fernet}
      - RECIPE_OAUTH_CALLBACK_URL=${RECIPE_OAUTH_CALLBACK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_IMPLICIT_TLS=${SMTP_IMPLICIT_TLS:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - PRIMARY_EMAIL_DOMAIN=${PRIMARY_EMAIL_DOMAIN:-}
      - RECIPES_EMAIL_ALLOWED_DOMAINS=${RECIPES_EMAIL_ALLOWED_DOMAINS:-}
      - GROUP_RULES_ENABLED=${GROUP_RULES_ENABLED:-true}
      - OIDC_ISSUER=${OIDC_ISSUER:-http://localhost:8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Passkeys: RP ID is the host the browser sees (no scheme/port); origins are exact scheme+host+port, comma-separated.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Ifora}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-["http://localhost:3000"]}
      # Sign-in through Cloudflare Access (demo only; off by default). See docker/.env.example.
      - ENROLLMENT_CODE_EMAIL=${ENROLLMENT_CODE_EMAIL:-false}
      - ACCESS_SSO_ENABLED=${ACCESS_SSO_ENABLED:-false}
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
      - ACCESS_AUD=${ACCESS_AUD:-}
      - ACCESS_SSO_AUTO_CREATE=${ACCESS_SSO_AUTO_CREATE:-true}
      # Keep the Access allowlist in step with invited/deleted users (all four needed; demo only).
      - ACCESS_ALLOWLIST_TOKEN=${ACCESS_ALLOWLIST_TOKEN:-}
      - ACCESS_ALLOWLIST_ACCOUNT_ID=${ACCESS_ALLOWLIST_ACCOUNT_ID:-}
      - ACCESS_ALLOWLIST_APP_ID=${ACCESS_ALLOWLIST_APP_ID:-}
      - ACCESS_ALLOWLIST_POLICY_ID=${ACCESS_ALLOWLIST_POLICY_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: ${FRONTEND_TARGET:-dev}   # dev (default) or prod: see docker/.env.example
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_ENVIRONMENT: ${NEXT_PUBLIC_APP_ENVIRONMENT:-development}
    container_name: ifora-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=${FRONTEND_NODE_ENV:-development}
      - NEXT_PUBLIC_APP_ENVIRONMENT=${NEXT_PUBLIC_APP_ENVIRONMENT:-development}
    ports:
      - "3000:3000"

  # Runs recipe triggers, schedules and jobs (ADR 008). Without it recipes are saved and published but never run.
  recipes-worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: ifora-recipes-worker
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    entrypoint: ["python", "-m", "backend.cli", "recipes-worker"]
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql+psycopg2://ifora:${POSTGRES_PASSWORD}@postgres:5432/ifora
      - DATABASE_URL_ASYNC=postgresql+asyncpg://ifora:${POSTGRES_PASSWORD}@postgres:5432/ifora
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in docker/.env}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in docker/.env}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in docker/.env}
      - RECIPE_ENCRYPTION_KEY=${RECIPE_ENCRYPTION_KEY:-}
      - RECIPE_ENCRYPTION_KEY_PREVIOUS=${RECIPE_ENCRYPTION_KEY_PREVIOUS:-}
      - RECIPE_SECRET_PROVIDER=${RECIPE_SECRET_PROVIDER:-fernet}
      - RECIPE_OAUTH_CALLBACK_URL=${RECIPE_OAUTH_CALLBACK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_IMPLICIT_TLS=${SMTP_IMPLICIT_TLS:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - RECIPES_EMAIL_ALLOWED_DOMAINS=${RECIPES_EMAIL_ALLOWED_DOMAINS:-}
      - RECIPES_ENABLED=${RECIPES_ENABLED:-true}
      - RECIPES_WORKER_HEARTBEAT_FILE=/tmp/recipes-worker.alive
      - ENVIRONMENT=${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/recipes-worker.alive') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional separate-origin relying party for trying the OIDC provider: --profile demo (see demo/oidc-rp/README.md)
  demo-app:
    profiles: ["demo"]
    build:
      context: ../demo/oidc-rp
    container_name: ifora-demo-app
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      - ISSUER=${OIDC_ISSUER:-http://localhost:8000}
      - INTERNAL_ISSUER=http://backend-api:8000
      - BASE_URL=http://localhost:4000
      - CLIENT_ID=${DEMO_CLIENT_ID:-}
      - CLIENT_SECRET=${DEMO_CLIENT_SECRET:-}
      - DEMO_ALLOW_CONFIG=${DEMO_ALLOW_CONFIG:-0}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
