# Drone CI: on every push to main, first pass backend tests and frontend checks, then build the api / recipes-worker / frontend images, push them to GHCR under the
# repository owner, then roll the demo stack and the local dev/prod stack onto them (scripts/ci-deploy.sh).
#
# The repo must be marked "Trusted" in Drone (Settings), because the steps mount the Docker socket and the host's home
# directory: the deploy needs the stacks' env files and bind-mounted configs, which live outside the repo. The runner's
# host path is the same as inside the step ($HOME below), so the compose bind mounts resolve on the host.
# Secrets (Drone UI or CLI): ghcr_user (GitHub login), ghcr_token (PAT with write:packages).
# Optional notifications: slack_webhook (Slack incoming webhook URL, no PR access).
kind: pipeline
type: docker
name: build-and-deploy

platform:
  os: linux
  arch: arm64 # Apple Silicon; the images are built and run on this Mac

trigger:
  branch: [main]
  event: [push]

clone:
  depth: 50

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: home
    host:
      path: /Users/chanderinguva

steps:
  # Fail fast on credentials/tooling before spending time on the full test suite.
  - name: preflight
    image: docker:27-cli
    depends_on: []
    environment:
      HOME: /Users/chanderinguva
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - apk add --no-cache bash git tar
      - bash scripts/ci-docker.sh preflight
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: home
        path: /Users/chanderinguva
        read_only: true

  # Reuse dependency layers locally; never publish test images to GHCR.
  - name: prepare-test-images
    image: docker:27-cli
    depends_on: [preflight]
    commands:
      - sh scripts/ci-prepare-test-images.sh
    volumes:
      - name: dockersock
        path: /var/run/docker.sock

  # Tests have no Docker socket, host home, or deployment credentials.
  - name: test-backend
    image: ifora-ci-backend:py312
    pull: never
    depends_on: [prepare-test-images]
    environment:
      DATABASE_URL: postgresql+psycopg2://ifora_ci:ci_only@ci-postgres:5432/postgres
      REDIS_URL: redis://ci-redis:6379/0
      TEST_DB_NAME: ifora_ci_test
      TEST_REDIS_DB: "15"
      SESSION_COOKIE_SECURE: "false"
      PUBLIC_APP_URL: http://localhost:3000
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      - python scripts/ci-test-backend.py

  - name: check-frontend
    image: ifora-ci-frontend:node20
    pull: never
    depends_on: [prepare-test-images]
    commands:
      - cd frontend
      - ln -s /opt/ci/frontend/node_modules node_modules
      - trap 'rm -f node_modules' EXIT
      - npm run lint
      - npm run type-check

  - name: build-and-push
    depends_on: [test-backend, check-frontend]
    image: docker:27-cli
    environment:
      HOME: /Users/chanderinguva
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - apk add --no-cache bash git tar
      - bash scripts/ci-docker.sh build
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: home
        path: /Users/chanderinguva

  - name: deploy-demo
    image: docker:27-cli
    environment:
      HOME: /Users/chanderinguva
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
    depends_on: [build-and-push]
    commands:
      - apk add --no-cache bash git tar
      - bash scripts/ci-docker.sh deploy demo
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: home
        path: /Users/chanderinguva

  # After the demo is healthy, so a bad build stops here and never reaches ifora.app.
  - name: deploy-local
    image: docker:27-cli
    environment:
      HOME: /Users/chanderinguva
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
    depends_on: [deploy-demo]
    commands:
      - apk add --no-cache bash git tar
      - bash scripts/ci-docker.sh deploy local
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: home
        path: /Users/chanderinguva

  # Notifications run alongside deployments, never as deployment prerequisites.
  # Pin the verified multi-architecture Slack plugin (includes linux/arm64).
  - name: slack-images-published
    image: plugins/slack@sha256:9d15ee6c5bcbb5aafd52a9b7680c61c098bdac1c3940f7f0a2ac08aa964b42d6
    depends_on: [build-and-push]
    failure: ignore
    settings:
      webhook:
        from_secret: slack_webhook
      template: >-
        Ifora build #${DRONE_BUILD_NUMBER}: tests passed and images published.
        Deployments are starting. <${DRONE_BUILD_LINK}|View build>
    when:
      status: [success]

  - name: slack-demo-deployed
    image: plugins/slack@sha256:9d15ee6c5bcbb5aafd52a9b7680c61c098bdac1c3940f7f0a2ac08aa964b42d6
    depends_on: [deploy-demo]
    failure: ignore
    settings:
      webhook:
        from_secret: slack_webhook
      template: >-
        Ifora build #${DRONE_BUILD_NUMBER}: demo deployment passed health checks.
        Dev/prod deployment is next. <${DRONE_BUILD_LINK}|View build>
    when:
      status: [success]

  - name: slack-pipeline-succeeded
    image: plugins/slack@sha256:9d15ee6c5bcbb5aafd52a9b7680c61c098bdac1c3940f7f0a2ac08aa964b42d6
    depends_on: [deploy-local, slack-images-published, slack-demo-deployed]
    failure: ignore
    settings:
      webhook:
        from_secret: slack_webhook
      template: >-
        Ifora build #${DRONE_BUILD_NUMBER} succeeded: tests and image publishing passed;
        demo and dev/prod deployments both passed health checks.
        Commit ${DRONE_COMMIT_SHA}. <${DRONE_BUILD_LINK}|View build>
    when:
      status: [success]

  - name: slack-pipeline-failed
    image: plugins/slack@sha256:9d15ee6c5bcbb5aafd52a9b7680c61c098bdac1c3940f7f0a2ac08aa964b42d6
    depends_on: [preflight, prepare-test-images, test-backend, check-frontend, build-and-push, deploy-demo, deploy-local, slack-images-published, slack-demo-deployed]
    failure: ignore
    settings:
      webhook:
        from_secret: slack_webhook
      template: >-
        Ifora build #${DRONE_BUILD_NUMBER} failed. Check the failed step;
        a deployment may have completed before a later failure. No automatic rollback.
        Commit ${DRONE_COMMIT_SHA}. <${DRONE_BUILD_LINK}|View failure>
    when:
      status: [failure]

# Ephemeral services on the pipeline network; no host ports, external networks,
# persistent volumes, or connections to either deployed stack.
services:
  - name: ci-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ifora_ci
      POSTGRES_PASSWORD: ci_only
      POSTGRES_DB: postgres
  - name: ci-redis
    image: redis:7-alpine

