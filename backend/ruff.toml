# Ruff (IFORA-20, widened in IFORA-53).
# Gate: syntax errors (E9) and all pyflakes rules (F: unused imports/variables, undefined names, invalid comparisons)
# across backend/, scripts/, sdk/ and demo/ (see `make lint-py`). The baseline of F401/F841 findings was cleared in IFORA-53.
# F811 (redefinition) is ignored in tests only: pytest fixtures imported into a test module and taken as an argument are
# reported as redefinitions. `ruff format` is not gated (code base is not ruff-formatted).
line-length = 140
target-version = "py312"
# Alembic revisions are frozen history; sdk/python/ifora/_generated.py is produced by sdk/python/generate.py (--check).
extend-exclude = ["**/migrations/versions", "**/_generated.py"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
"**/tests/**" = ["F811"]
"**/conftest.py" = ["F811"]
