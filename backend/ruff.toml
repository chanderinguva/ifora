# Ruff (IFORA-20).
# The repo-wide gate covers real bugs only: syntax errors (E9), invalid comparisons/prints (F63), undefined names (F82),
# and syntax-error-class pyflakes (F7). Unused imports/variables (F401/F841) and pytest-fixture "redefinitions" (F811)
# are a recorded baseline, not gated repo-wide; `make lint-py` applies the stricter set (F, minus F811) to backend/app
# files CHANGED against origin/main so new code stays clean. `ruff format` is not gated (code base is not ruff-formatted).
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/versions"]

[lint]
select = ["E9", "F63", "F7", "F82"]
