# mypy (IFORA-20): run on files changed against origin/main only (see Makefile `types-py`).
# The existing code base is not fully typed, so third-party and untyped imports are tolerated; widening is a follow-up.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False
