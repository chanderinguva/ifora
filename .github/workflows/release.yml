name: Weekly release

# Every Monday 09:00 UTC (and on demand) a DRAFT release is prepared from main, if main has moved since the last
# release. Review the draft's notes, then press "Publish" to create the tag. See docs/RELEASING.md.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Create a draft even if main has no new commits since the last release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  check:
    name: Anything to release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last" ]; then n="$(git rev-list --count HEAD)"; else n="$(git rev-list --count "$last"..HEAD)"; fi
          echo "last release: ${last:-none}; commits since: $n"
          if [ "$n" -gt 0 ] || [ "${{ inputs.force }}" = "true" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    name: Checks on main
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare the draft release
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the draft
        run: |
          # date-based version; a second release on the same day gets .1, .2 ...
          base="v$(date -u +%Y.%m.%d)"
          version="$base"; i=0
          while git rev-parse -q --verify "refs/tags/$version" >/dev/null || gh release view "$version" >/dev/null 2>&1; do
            i=$((i+1)); version="$base.$i"
          done
          # last week's draft that nobody published is stale: replace it
          for t in $(gh release list --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName'); do
            gh release delete "$t" --yes
          done
          gh release create "$version" --draft --target "$GITHUB_SHA" --title "$version" --generate-notes
          echo "Draft $version created from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
